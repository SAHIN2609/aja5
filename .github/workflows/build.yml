name: Build SISHHIN HZ MACHINE VST3

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64 VST3
            artifact: SISHHIN-HZ-MACHINE-VST3-Windows-x64
            cmake_args: -A x64
          - os: macos-latest
            name: macOS Universal VST3
            artifact: SISHHIN-HZ-MACHINE-VST3-macOS
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - os: ubuntu-22.04
            name: Linux x64 VST3
            artifact: SISHHIN-HZ-MACHINE-VST3-Linux-x64
            cmake_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libglu1-mesa-dev

      - name: Configure CMake
        env:
          # Passed via env so semicolons (macOS universal arch list) are not shell operators.
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: cmake -S SISHHIN-HZ-MACHINE-v1.10.0 -B build -DCMAKE_BUILD_TYPE=Release $CMAKE_ARGS

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Collect VST3 bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' |
            Where-Object { $_.Name -eq 'SISHHIN HZ MACHINE.vst3' } |
            Select-Object -First 1
          if (-not $vst3) {
            $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          }
          if (-not $vst3) { throw 'No .vst3 bundle was produced' }
          Write-Host "Found VST3: $($vst3.FullName)"
          Copy-Item -Recurse -Force $vst3.FullName dist/
          if (-not (Test-Path 'dist/*.vst3')) { throw 'Collected VST3 bundle is missing' }
          Get-ChildItem -Recurse dist | Select-Object FullName,Length

      - name: Collect VST3 bundle (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          vst3="$(find build -type d -name '*.vst3' | head -n 1)"
          if [ -z "$vst3" ]; then echo 'No .vst3 bundle was produced'; exit 1; fi
          echo "Found VST3: $vst3"
          cp -R "$vst3" dist/
          test -d dist/*.vst3
          find dist -maxdepth 3 | sort

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Package release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          zip -r "../${{ matrix.artifact }}.zip" .
          cd ..
          ls -l "${{ matrix.artifact }}.zip"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ matrix.artifact }}.zip
