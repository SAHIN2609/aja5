name: Windows x64 VST3 Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/run-cmake@v10
        with:
          cmakeListsTxtPath: SISHHIN-HZ-MACHINE-v1.10.0/CMakeLists.txt
          configurePreset: default
          buildPreset: default

      - name: Build VST3
        shell: powershell
        run: |
          cmake -S SISHHIN-HZ-MACHINE-v1.10.0 -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-VST3
          path: |
            build/**/*.vst3
